
# Pin output to the on-board RK817 codec. Plugging a DualSense exposes its
# USB audio as card 1 and the default route may steal the game audio (it
# also fights ES/pulseaudio for the hw device - measured "Device busy").
# Keep game sound on the handheld speakers regardless of what else is
# plugged in. To prefer a controller speaker instead, remove this section.
[alsa]
device = hw:rockchiprk817co
