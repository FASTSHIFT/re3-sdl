# OpenAL Soft config for reVC on R36S (RK3326, PulseAudio -> RK817 codec)
# Adapted from re3's Pi Zero 2 W tuning (b27fe89f) to reduce audio CPU.
# The device runs 4 cores, so unlike the single-core Pi we keep the mixer
# thread off the game thread differently (see rt-prio below).

[general]
# Match VC sfx native rate (22050Hz, verified in Audio/*.wav headers and
# sampman_oal.cpp). Avoids OpenAL resampling sfx internally; PulseAudio
# does the single 22050->44100 upsample to the codec instead (two passes
# down from default).
frequency = 22050

# 512 samples @ 22050Hz = 23ms period. Larger than the default 1/50th,
# reduces mixer wakeup frequency.
period_size = 512

# 2 periods = 46ms total buffer. VC feeds audio regularly from the game
# loop; minimum buffering keeps latency low without underruns.
periods = 2

# Fastest reasonable resampler. VC sfx are 22050Hz so at this rate they
# need no resample at all; engine/pitch-modulated sounds are far less
# aliased than with 'point' (which broke vehicle sounds on device).
resampler = linear

# Disable real-time priority for the mixer thread.
# Default rt-prio=1 competes with the game main thread on the A53 cluster.
rt-prio = 0

# Concurrency headroom above VC's steady-state usage (~28 sfx + 2 streams).
# 32 dropped vehicle sounds on busy streets; 64 keeps headroom without the
# default 256's bookkeeping cost.
sources = 64

# Stereo speakers on the handheld; no HRTF processing needed.
hrtf = false
stereo-encoding = basic
